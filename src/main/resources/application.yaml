server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedHeaders: "*"
            allowedMethods:
              - POST

      routes:
        - id: catalogue
          uri: lb://catalogue-service
          predicates:
            - Path=/catalogue/**
            - Method=POST
          filters:
            - StripPrefix=1

        - id: orders
          uri: lb://orders-service
          predicates:
            - Path=/orders/**
            - Method=POST
          filters:
            - StripPrefix=1

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, gateway
